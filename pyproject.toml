[project]
name = "fake_news_crew"
version = "0.1.0"
description = "fake_news_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.2",
    "langchain-google-genai",
    "langchain-community",
    "ddgs",
    "python-dotenv",
    "google-generativeai",
    "groq",
    "litellm"

]

[project.scripts]
fake_news_crew = "fake_news_crew.main:run"
run_crew = "fake_news_crew.main:run"
train = "fake_news_crew.main:train"
replay = "fake_news_crew.main:replay"
test = "fake_news_crew.main:test"
run_with_trigger = "fake_news_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
