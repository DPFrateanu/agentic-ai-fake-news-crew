research_task:
  description: >
    Analizează critic următoarea afirmație sau text folosind exclusiv cunoștințele tale interne:
    "{subiect}".
    Trebuie să identifici posibile erori logice, semne de manipulare emoțională, ton senzaționalist 
    sau lipsa unui context clar. Bazează-te pe datele istorice și științifice cunoscute pentru a 
    evalua probabilitatea ca afirmația să fie o dezinformare.
  expected_output: >
    Un raport detaliat de analiză (Research Report) care conține argumentele logice pro și contra 
    afirmației, precum și o listă cu "red flags" (semnale de alarmă) identificate în structura sau 
    mesajul textului.
  agent: jurnalist

fact_check_task:
  description: >
    Analizează raportul primit de la jurnalist referitor la afirmația:
    "{subiect}".
    Evaluează coerența logică a argumentelor prezentate. Bazează-te strict pe logică, 
    pe principiile științifice și pe faptele general acceptate pentru a decide 
    dacă afirmația este fezabilă sau este pură manipulare.
  expected_output: >
    Un verdict logic clar (Adevărat / Fals / Parțial Fals / Neverificabil fără date curente) 
    însoțit de un scor de încredere (de la 1 la 100) și argumentul principal care susține decizia ta.
  agent: fact_checker

reporting_task:
  description: >
    Preia verdictul de la fact-checker și redactează raportul final.
    Raportul trebuie să fie curat, profesionist și să includă: 
    1. Afirmația originală, 
    2. Verdictul, 
    3. Scorul de încredere, 
    4. Explicația detaliată a motivului pentru care este (sau nu) fake news, bazată pe analiza logică, 
    5. Recomandări de verificare (ce termeni ar trebui să caute un utilizator pe Google pentru a 
       confirma factual dacă dorește).
  expected_output: >
    Un raport final formatat impecabil în format Markdown, pregătit pentru a fi citit 
    de utilizatorul final pe ecran.
  agent: redactor